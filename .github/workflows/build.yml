name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Fix Wrapper & Line Endings
        run: |
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew
          gradle wrapper --gradle-version 8.7

      - name: Build and Print Error directly
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_output.log || (echo "=== خطاهای کامپایل ===" && grep -A 25 -i -E "e: |error:|FAILURE:|BUILD FAILED" /tmp/gradle_output.log && exit 1)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
