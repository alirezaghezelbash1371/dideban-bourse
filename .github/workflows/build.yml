plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.didebanbourse'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.didebanbourse'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
}
