name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Wrapper and Build
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build_output.log
        continue-on-error: true

      - name: Show Result
        if: always()
        run: |
          echo "### Build Log Output" >> $GITHUB_STEP_SUMMARY
          echo "<pre>" >> $GITHUB_STEP_SUMMARY
          
          if [ -f build_output.log ]; then
            if grep -q "FAILURE: Build failed" build_output.log; then
              grep -B 2 -A 35 "FAILURE: Build failed" build_output.log >> $GITHUB_STEP_SUMMARY
            elif grep -q "e: " build_output.log; then
              grep -B 2 -A 20 "e: " build_output.log | head -n 40 >> $GITHUB_STEP_SUMMARY
            else
              tail -n 40 build_output.log >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "build_output.log was not created." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "</pre>" >> $GITHUB_STEP_SUMMARY
          
          if [ -f build_output.log ] && grep -q "BUILD SUCCESSFUL" build_output.log; then
            exit 0
          else
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
